name: Wiki

on:
  push:
    branches: [main]
    paths:
      - "wiki/**"
      - ".github/workflows/wiki.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: windows-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build the public wiki
        shell: pwsh
        run: ./wiki/_static/build-docs.ps1

      - uses: actions/upload-pages-artifact@v3
        with:
          path: wiki/_static

      - id: deployment
        uses: actions/deploy-pages@v4
