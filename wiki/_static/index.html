<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SSF2 Mod Manager Wiki</title>
  <link rel="stylesheet" href="site.css" />
  <script>
    (function () {
      var theme = localStorage.getItem("wiki-theme") || "light";
      document.documentElement.setAttribute("data-theme", theme);
      var font = localStorage.getItem("wiki-font") || "16";
      document.documentElement.style.fontSize = font + "px";
      if (localStorage.getItem("wiki-contrast") === "1") document.documentElement.setAttribute("data-theme", "contrast");
      if (localStorage.getItem("wiki-dyslexic") === "1") document.documentElement.classList.add("dyslexic");
      function easterSunday(year) {
        var a = year % 19, b = Math.floor(year / 100), c = year % 100;
        var d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25);
        var g = Math.floor((b - f + 1) / 3);
        var h = (19 * a + b - d - g + 15) % 30;
        var i = Math.floor(c / 4), k = c % 4;
        var l = (32 + 2 * e + 2 * i - h - k) % 7;
        var m = Math.floor((a + 11 * h + 22 * l) / 451);
        var month = Math.floor((h + l - 7 * m + 114) / 31);
        return { m: month - 1, d: ((h + l - 7 * m + 114) % 31) + 1 };
      }
      function thanksgiving(year) {
        var first = new Date(year, 10, 1).getDay();
        return 1 + ((4 - first + 7) % 7) + 21;
      }
      window.wikiHoliday = function (now) {
        var y = now.getFullYear(), m = now.getMonth(), d = now.getDate();
        if ((m === 0 && d === 1) || (m === 11 && d === 31)) return { id: "newyear", mark: "🎉" };
        if (m === 1 && d === 14) return { id: "valentine", mark: "💗" };
        if (m === 2 && d === 17) return { id: "patrick", mark: "☘️" };
        if (m === 3 && d === 1) return { id: "fools", mark: "🃏" };
        var easter = easterSunday(y);
        if (m === easter.m && (d === easter.d || d === easter.d - 1)) return { id: "easter", mark: "🐣" };
        if (m === 6 && d === 4) return { id: "july4", mark: "🎆" };
        if (m === 9 || (m === 10 && d <= 7)) return { id: "halloween", mark: "🎃" };
        if (m === 10 && d === thanksgiving(y)) return { id: "thanksgiving", mark: "🦃" };
        if (m === 11 && d <= 26) return { id: "christmas", mark: "🎄" };
        return null;
      };
      var holiday = window.wikiHoliday(new Date());
      if (holiday) document.documentElement.classList.add("holiday", holiday.id);
    })();
  </script>
</head>
<body>
  <div id="site-tools">
    <button type="button" id="theme-toggle">Dark</button>
    <button type="button" id="a11y-toggle" aria-expanded="false" aria-controls="a11y-panel">Accessibility</button>
    <div id="a11y-panel" hidden>
      <p>Text size</p>
      <div class="a11y-sizes">
        <button type="button" data-font="16">Default</button>
        <button type="button" data-font="18">Large</button>
        <button type="button" data-font="20">Larger</button>
      </div>
      <label><input type="checkbox" id="a11y-contrast"> High contrast</label>
      <label><input type="checkbox" id="a11y-dyslexic"> Dyslexia-friendly text</label>
    </div>
  </div>
  <button type="button" class="mobile-toggle" id="nav-toggle">Menu</button>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-name">
          <a href="#/">SSF2 Mod Manager Wiki</a>
          <img class="brand-logo" src="ssf2m.png" alt="SSF2M">
        </div>
        <span class="sub">Wiki</span>
      </div>
      <div class="wiki-tools">
        <input id="wiki-search" type="search" placeholder="Search, or ask a question" autocomplete="off" />
        <div id="wiki-hits"></div>
      </div>
      <nav class="menu" id="sidebar-nav"></nav>
      <div class="wiki-actions">
        <button type="button" id="new-tutorial">New tutorial</button>
        <button type="button" id="import-tutorial">Import tutorial</button>
        <input id="import-file" type="file" accept=".zip" hidden />
      </div>
    </aside>
    <main class="main" id="content">
      <p class="lead">Loading…</p>
    </main>
  </div>
  <script src="md.js"></script>
  <script>
    (function () {
      var s = document.createElement("script");
      s.src = "content.js?t=" + Date.now();
      s.onload = function () {
        var app = document.createElement("script");
        app.src = "app.js?t=" + Date.now();
        document.body.appendChild(app);
      };
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
